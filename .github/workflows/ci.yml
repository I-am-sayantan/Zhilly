# Checks on every push and pull request; on main, deploys the site and the calendar Worker.
# Rollback: Cloudflare dashboard > Workers & Pages > zhilly > Deployments > "Rollback" on an older one,
# or GitHub > Actions > an older successful run on main > "Re-run all jobs". See README.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            calendar/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        # IDs stay out of the public repo: GitHub secrets, README "Secrets and variables"
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.GTM_ID }}
      - name: Calendar Worker tests
        working-directory: calendar
        run: npm ci && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak check (no IDs or keys in tracked files)
        run: bash scripts/leak-check.sh

  deploy:
    needs: [check, leak-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # one deploy at a time, in order; never cancel a deploy half-way
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://zhilly.life
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: calendar/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      # fail before anything deploys, naming each missing secret (values are never printed)
      - name: Check the secrets and the built site
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          fail=0
          [ -n "$INDEXNOW_KEY" ] || { echo "The INDEXNOW_KEY secret is missing or empty." >&2; fail=1; }
          [ -n "$D1_DATABASE_ID" ] || { echo "The D1_DATABASE_ID secret is missing or empty." >&2; fail=1; }
          grep -q googletagmanager out/index.html || { echo "The built site has no GTM snippet: the GTM_ID secret is missing or empty." >&2; fail=1; }
          grep -rqE '0x4A{3}' out/_next/static || { echo "The built site has no Turnstile key: the TURNSTILE_SITE_KEY secret is missing or empty." >&2; fail=1; }
          exit $fail
      - name: Add the IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          printf '%s' "$INDEXNOW_KEY" > "out/$INDEXNOW_KEY.txt"
          { echo; echo "/$INDEXNOW_KEY.txt"; echo "  ! X-Robots-Tag"; } >> out/_headers
      - name: Install wrangler
        working-directory: calendar
        run: npm ci
      - name: Deploy the site to Cloudflare Pages
        working-directory: calendar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy ../out --project-name=zhilly --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7} $(git log -1 --format=%s | head -c 300)"
      - name: Deploy the calendar Worker
        working-directory: calendar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
          grep -qF "$D1_DATABASE_ID" wrangler.toml || { echo "D1_DATABASE_ID was not written into wrangler.toml (did the database_id line change?)." >&2; exit 1; }
          npx wrangler deploy --message="${GITHUB_SHA::7}"
