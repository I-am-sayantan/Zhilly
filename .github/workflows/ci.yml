# Checks on every push and pull request; on main, deploys the site (and the calendar Worker when calendar/ changed).
# Rollback: Cloudflare dashboard > Workers & Pages > zhilly > Deployments > "Rollback" on an older one,
# or GitHub > Actions > an older successful run on main > "Re-run all jobs". See README.md.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            calendar/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Calendar Worker tests
        working-directory: calendar
        run: npm ci && npm test
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # one deploy at a time, in order; never cancel a deploy half-way
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://zhilly.life
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: calendar/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Install wrangler
        working-directory: calendar
        run: npm ci
      - name: Deploy the site to Cloudflare Pages
        working-directory: calendar
        run: >-
          npx wrangler pages deploy ../out --project-name=zhilly --branch=main
          --commit-hash="$GITHUB_SHA" --commit-message="${GITHUB_SHA::7} $(git log -1 --format=%s | head -c 300)"
      - name: Did calendar/ change?
        id: cal
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"   # manual run or first push: deploy to be safe
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- calendar/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the calendar Worker
        if: steps.cal.outputs.changed == 'true'
        working-directory: calendar
        run: npx wrangler deploy --message="${GITHUB_SHA::7}"
