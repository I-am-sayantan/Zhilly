# Zhilly availability calendar + booking enquiries (Cloudflare Workers free plan + D1 free tier).
# Setup steps: ../DEPLOY-CLOUDFLARE.md
name = "zhilly-calendar"
main = "src/index.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "cal.zhilly.life", custom_domain = true }]

[triggers]
crons = ["*/15 * * * *"] # pull every OTA import link

[vars]
# Websites allowed to read /availability and post /enquiry (comma separated).
ALLOWED_ORIGINS = "https://zhilly.life,https://www.zhilly.life,https://zhilly.pages.dev"
# Sender of the booking enquiry emails (Resend); must be on a domain verified in Resend.
# shortcut: onboarding@resend.dev until zhilly.life is verified in Resend; it can only email the Resend account's own
# address (the owner), so guest copies fail until then. After verifying, change to "bookings@zhilly.life" and deploy.
FROM_EMAIL = "onboarding@resend.dev"
# Secrets, never in this file (`npx wrangler secret put NAME`):
#   ADMIN_PASSWORD, TURNSTILE_SECRET, RESEND_API_KEY, OWNER_EMAIL (where enquiries go; kept out of the public repo)

[[d1_databases]]
binding = "DB"
database_name = "zhilly-calendar"
# Real id is the GitHub secret D1_DATABASE_ID; CI writes it in before `wrangler deploy` (README "Secrets and variables").
database_id = "D1_DATABASE_ID"

# Worker logs in the dashboard (Observability), so failed enquiry emails can be seen.
[observability]
enabled = true
